[workspace]
members = [
    "crates/hmi-core",
    "crates/hmi-ui",
    "crates/hmi-control-protocol",
    "apps/studio",
    "apps/control",
    "apps/editor",
    "xtask",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.dev]
opt-level = 1
debug = 1
incremental = true

[profile.dev.package."*"]
opt-level = 1
debug = false

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
# wasm-bindgen needs custom sections emitted by the linker. Final stripping is
# performed by wasm-opt after binding; stripping here breaks LLVM 23 builds.
strip = false

