[package]
name = "mox-hmi-studio"
version.workspace = true
edition.workspace = true

[features]
default = []
web = ["dioxus/web", "scene"]
server = ["dioxus/server", "dep:tokio", "dep:tracing"]
scene = [
  "dep:bevy",
  "dep:dioxus-cli-config",
  "dep:js-sys",
  "dep:wasm-bindgen",
  "dep:wasm-bindgen-futures",
  "dep:web-sys",
  "dep:objc2",
  "dep:objc2-core-haptics",
  "dep:objc2-foundation",
  "dep:objc2-game-controller",
]

[dependencies]
hmi-core = { path = "../../crates/hmi-core" }
mox-hmi-ui = { path = "../../crates/hmi-ui" }
bevy = { version = "0.20.1", default-features = false, features = [
  "std",
  "async_executor",
  "bevy_asset",
  "bevy_log",
  "bevy_state",
  "reflect_auto_register",
  "bevy_winit",
  "bevy_window",
  "bevy_gilrs",
  "gamepad",
  "multi_threaded",
  "web",
  "webgpu",
  "default_font",
  "2d_bevy_render",
  "3d_bevy_render",
  "bevy_picking",
  "mesh_picking",
  "bevy_scene",
  "bevy_gizmos_render",
  "png",
], optional = true }
dioxus-cli-config = { version = "=0.8.0-alpha.3", optional = true }
dioxus = { version = "=0.8.0-alpha.3", default-features = false, features = [
  "minimal",
  "fullstack",
  "asset",
  "document",
] }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"], optional = true }
tracing = { version = "0.1", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3", features = [
  "Window",
  "Document",
  "Element",
  "Navigator",
  "Gamepad",
  "GamepadButton",
  "AudioContext",
  "AudioContextState",
  "AudioDestinationNode",
  "AudioNode",
  "AudioParam",
  "GainNode",
  "OscillatorNode",
  "OscillatorType",
], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6.5", optional = true }
objc2-foundation = { version = "0.3.2", features = ["NSString"], optional = true }
objc2-game-controller = { version = "0.3.2", default-features = false, features = [
  "std",
  "GCController",
  "GCControllerAxisInput",
  "GCControllerButtonInput",
  "GCControllerDirectionPad",
  "GCControllerElement",
  "GCDevice",
  "GCDeviceHaptics",
  "GCExtendedGamepad",
  "GCInputNames",
  "GCPhysicalInputProfile",
], optional = true }
objc2-core-haptics = { version = "0.3.2", default-features = false, features = [
  "std",
  "CHHapticEngine",
  "CHHapticEvent",
  "CHHapticParameter",
  "CHHapticPattern",
  "CHHapticPatternPlayer",
], optional = true }
