[package]
name = "mox-hmi-studio"
version.workspace = true
edition.workspace = true

[dependencies]
hmi-core = { path = "../../crates/hmi-core" }
mox-hmi-ui = { path = "../../crates/hmi-ui" }
bevy = { version = "0.20.1", default-features = false, features = [
  "std",
  "async_executor",
  "bevy_asset",
  "bevy_log",
  "bevy_state",
  "reflect_auto_register",
  "bevy_winit",
  "bevy_window",
  "bevy_gilrs",
  "gamepad",
  "multi_threaded",
  "web",
  "webgpu",
  "default_font",
  "2d_bevy_render",
  "3d_bevy_render",
  "bevy_picking",
  "mesh_picking",
  "bevy_scene",
  "bevy_gizmos_render",
  "png",
] }
dioxus-cli-config = "=0.8.0-alpha.3"
dioxus = { version = "=0.8.0-alpha.3", default-features = false, features = [
  "minimal",
  "web",
  "asset",
  "document",
] }
wasm-bindgen-futures = "0.4"
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
  "Window",
  "Document",
  "Element",
  "Navigator",
  "Gamepad",
  "GamepadButton",
  "AudioContext",
  "AudioContextState",
  "AudioDestinationNode",
  "AudioNode",
  "AudioParam",
  "GainNode",
  "OscillatorNode",
  "OscillatorType",
] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", features = ["NSString"] }
objc2-game-controller = { version = "0.3.2", default-features = false, features = [
  "std",
  "GCController",
  "GCControllerAxisInput",
  "GCControllerButtonInput",
  "GCControllerDirectionPad",
  "GCControllerElement",
  "GCDevice",
  "GCDeviceHaptics",
  "GCExtendedGamepad",
  "GCInputNames",
  "GCPhysicalInputProfile",
] }
objc2-core-haptics = { version = "0.3.2", default-features = false, features = [
  "std",
  "CHHapticEngine",
  "CHHapticEvent",
  "CHHapticParameter",
  "CHHapticPattern",
  "CHHapticPatternPlayer",
] }
