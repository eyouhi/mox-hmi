[package]
name = "mox-hmi-ui"
version.workspace = true
edition.workspace = true

[dependencies]
base64 = "0.22"
hmi-core = { path = "../hmi-core" }
hmi-control-protocol = { path = "../hmi-control-protocol" }
dioxus = { version = "=0.8.0-alpha.3", default-features = false, features = [
  "minimal",
  "asset",
  "document",
] }
serde_json.workspace = true
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
  "Window",
  "WebSocket",
  "Location",
  "MessageEvent",
  "CloseEvent",
  "Event",
  "EventTarget",
  "Navigator",
  "Clipboard",
  "Storage",
  "Document",
  "Element",
  "Node",
  "HtmlAnchorElement",
  "HtmlCanvasElement",
  "HtmlInputElement",
  "Blob",
  "BlobPropertyBag",
  "Url",
  "console",
] }
js-sys = "0.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-timers = { version = "0.3", features = ["futures"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
futures-timer = "3"
time = { version = "0.3.55", features = ["local-offset"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSPasteboard"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSString"] }
